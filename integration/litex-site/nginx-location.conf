# Example only: serve static extension assets and reverse-proxy the API while
# leaving the existing Litex SPA/router in control of /textbook/Chess/*.
location /extensions/chess/ {
    alias /srv/litex-chess/frontend/;
    try_files $uri =404;
}
location /textbook-source/ {
    alias /srv/litex-chess/textbook/;
    try_files $uri =404;
}
location /api/ {
    proxy_pass http://127.0.0.1:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
